[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adai"
version = "0.1.0"
description = "Amharic Document AI - phone photo of an Ethiopian document to structured Markdown/JSON"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

# Pinned as compatible ranges here; exact pins live in requirements/*.lock.txt,
# generated by `make lock` and verified to co-install. See docs/RESEARCH.md section 3.
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "pydantic[email]>=2.13,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "alembic>=1.19,<2",
    "psycopg[binary,pool]>=3.3,<4",
    "arq>=0.28,<0.29",
    # arq 0.28 requires redis[hiredis]>=4.2,<6, so it owns this pin and caps us at
    # redis-py 5.x while 8.x is current. Verified not a security issue: pip-audit
    # reports no known vulnerabilities in redis 5.3.1. Tracked in ADR-0011.
    "redis>=5.0,<6",
    "argon2-cffi>=25.1,<26",
    "python-multipart>=0.0.20,<0.1",
    "itsdangerous>=2.2,<3",
    # Pillow >=12 is a hard floor: 10.4.0 carries 24 known CVEs and this is the
    # decoder that touches hostile uploads. See ADR-0007 and THREAT_MODEL T-03/T-27.
    "pillow>=12.3,<13",
    "numpy>=2.1,<3",
    "structlog>=25.1,<26",
    "rapidfuzz>=3.14,<4",
    "unicodedata2>=17,<18",
    # AEAD for encrypting sensitive columns at rest (control C-37).
    "cryptography>=44,<48",
]

[project.optional-dependencies]
# Heavy ML stack. Installed ONLY in the worker image, never in the api image
# (ADR-0007 / control C-45). Declared here, resolution-verified, but not
# installed in the sandbox that produced this repo - see docs/STATUS.md.
ml = [
    "torch>=2.9,<2.14",
    "torchvision>=0.24,<1",
    "kraken>=7.1,<8",
    "onnxruntime>=1.29,<2",
    "opencv-python-headless>=4.10,<6",
    # kraken 7.1 caps safetensors<0.8; it owns this pin. C-34 needs the safetensors
    # FORMAT, not a specific version, so this is not a control weakening.
    "safetensors>=0.7,<1",
]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.0,<8",
    "httpx>=0.28,<1",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "types-requests",
    "pip-audit>=2.10,<3",
    "detect-secrets>=1.5,<2",
    "cyclonedx-bom>=7.3,<8",
]

[project.scripts]
adai-eval = "adai.eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "PTH", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    # RUF001/2/3 flag "ambiguous unicode" -- for this project that means every
    # Ethiopic character, which is the entire subject matter. Suggesting that ሀ
    # (U+1200) might be a mistyped Latin "U" is the rule misfiring on the domain.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["N999", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
mypy_path = "src"
packages = ["adai"]

[[tool.mypy.overrides]]
module = ["arq.*", "argon2.*", "unicodedata2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live Postgres and Redis",
    "security: security control regression test",
]
